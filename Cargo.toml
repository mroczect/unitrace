[workspace]
members = ["unitrace_db", "unitrace_db_cli","unitrace_db_core", "unitrace_db_ffi", "unitrace_db_gui_core", "unitrace_db_gui_handler","unitrace_db_handler"]
resolver = "3"

[workspace.package]
authors = ["mroczect"]
categories = ["database", "cryptography", "command-line-utilities"]
edition = "2024"
rust-version = "1.96"
homepage = "https://github.com/mroczect/unitrace"
repository = "https://github.com/mroczect/unitrace"
license = "MIT"
keywords = ["database", "sqlcipher", "search", "encryption", "offline"]

[workspace.dependencies]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
large_stack_arrays = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

allow_attributes = "allow"
allow_attributes_without_reason = "deny"
doc_lazy_continuation = "allow"
doc_markdown = "allow"
empty_docs = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_name_repetitions = "allow"
needless_doctest_main = "allow"
needless_return = "allow"
uninlined_format_args = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
invalid_reference_casting = "deny"

deprecated = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
no_mangle_generic_items = "deny"
non_ascii_idents = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
noop_method_call = "deny"
overlapping_range_endpoints = "deny"
private_bounds = "deny"
private_interfaces = "deny"
redundant_lifetimes = "deny"
renamed_and_removed_lints = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_bounds = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unexpected_cfgs = "deny"
uninhabited_static = "deny"
unit_bindings = "deny"
unknown_lints = "deny"
unnameable_types = "deny"
unused_doc_comments = "allow"
unreachable_code = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unused = { level = "deny", priority = -1 }
unused_allocation = "deny"
unused_assignments = "deny"
unused_braces = "deny"
unused_comparisons = "deny"
unused_crate_dependencies = "deny"
unused_extern_crates = "deny"
unused_features = "deny"
unused_imports = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_macros = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_parens = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_unsafe = "deny"
unused_variables = "deny"
missing_docs = "allow"
warnings = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug-assertions = false
incremental = false

[profile.dev]
opt-level = 0
overflow-checks = true

[profile.test]
opt-level = 1
overflow-checks = true
