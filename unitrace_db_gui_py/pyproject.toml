[project]
name = "unitrace-db-gui-py"
version = "0.1.0"
description = "Tkinter GUI for unitrace database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
unitrace-db-gui-py = "unitrace_db_gui_py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitrace_db_gui_py"]
